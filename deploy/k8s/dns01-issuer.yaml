# A cert-manager ClusterIssuer that proves domain control via DNS-01 using the
# DigitalOcean DNS API. Required for the WILDCARD cert *.weavn.io — Let's Encrypt
# only issues wildcards over DNS-01, never HTTP-01 (which the existing
# letsencrypt-prod issuer uses for the exact apex/app hosts).
#
# The DO API token lives in the Secret `digitalocean-dns` (key `access-token`) in
# the cert-manager namespace; `scripts/app.sh --deploy` creates it from do.conf.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: viktorvondrakk@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
