[package]
name = "weavn"
version.workspace = true
edition.workspace = true
license.workspace = true

# Modules here mirror the production crate split in docs/DESIGN.md §11
# (proto / format / jira / store / gateway). Kept as one crate for the
# prototype so the walking skeleton builds and iterates fast.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"], optional = true }

[features]
# Off by default: the mock backend needs no network. Turn on to POST to a
# real JIRA Cloud site (needs crates.io access to pull reqwest the first time).
real-jira = ["dep:reqwest"]
