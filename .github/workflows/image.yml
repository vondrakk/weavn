name: image

# Build and push the weavn-gateway container image to the in-cluster GitLab
# registry. Runs on a version tag (alongside the release binaries) or on demand.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   GITLAB_REGISTRY_USER   e.g. gitlab+deploy-token-N  (a deploy token username)
#   GITLAB_REGISTRY_TOKEN  the deploy token value, scope: write_registry
# The GitLab project weavn/weavn must exist (its registry is the push target).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: short SHA)"
        required: false
        default: ""

env:
  REGISTRY: registry.git.vondrakk.com
  IMAGE: registry.git.vondrakk.com/weavn/weavn/gateway

jobs:
  image:
    name: build & push gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
