name: release

# Build release binaries of `weavn` when a version tag is pushed.
# Targets for now: Linux x86_64 and Apple Silicon (new Mac). Both build
# natively on their runners — no cross-compilation.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-14 # Apple Silicon runner
            target: aarch64-apple-darwin
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p weavn-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/weavn-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" weavn
          (cd dist && shasum -a 256 *.tar.gz > "weavn-${{ github.ref_name }}-${{ matrix.name }}.sha256")

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
